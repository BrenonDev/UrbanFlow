<main class="login-page">
  <section class="auth-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          <div class="auth-card">
            <div class="text-center mb-4">
              <span class="auth-icon">UF</span>
              <h1>Entrar no Urban Flow</h1>
              <p>
                Acesse sua conta para continuar suas missões urbanas e acompanhar
                seu progresso.
              </p>
            </div>

            <form>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="seunome@email.com"
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Digite sua senha"
                />
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" />
                  <label class="form-check-label" for="remember">
                    Lembrar-me
                  </label>
                </div>

                <a class="auth-link" href="#">Esqueci a senha</a>
              </div>

              <button type="button" class="btn btn-urban w-100">
                Entrar
              </button>
            </form>

            <div class="auth-footer">
              <span>Ainda não tem conta?</span>
              <a routerLink="/signup">Criar conta gratuita</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
